name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Testes (Windows / Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow lightgbm numpy pandas structlog pytest comtypes

      - name: Syntax check (compile todos os .py)
        run: |
          python -c "
          import pathlib, py_compile
          skip = {'__pycache__', 'docs', 'legacy', 'archive', 'dist', 'build', '.git'}
          falhas = []
          for p in pathlib.Path('.').rglob('*.py'):
              if any(s in p.parts for s in skip):
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as e:
                  falhas.append((str(p), e))
          if falhas:
              for f, e in falhas:
                  print(f'FALHA: {f}: {e}')
              raise SystemExit(1)
          print('Compile OK — todos os arquivos .py válidos')
          "

      - name: Suíte de testes (tests/ + testes/)
        run: python -m pytest tests/ testes/ -q --no-header -p no:cacheprovider

      - name: Validação App() (import do motor)
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from core.app import App; App(); print('App OK')"